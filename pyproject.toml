[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memtruth"
version = "0.1.0"
description = "Compare tracemalloc bytes with resident memory, and measure what the profiler itself costs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
memtruth = "memtruth.cli:main"

[tool.setuptools.packages.find]
include = ["memtruth*"]
